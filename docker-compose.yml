version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./pm.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Required, no default: compose refuses to start without it, and the
      # app itself refuses missing/default/short keys (see docs/SECURITY.md).
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env - see docs/SECURITY.md}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_BASE_URL=http://localhost:8000
    volumes:
      - ./pm.db:/app/pm.db
    restart: unless-stopped
