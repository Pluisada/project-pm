[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management MVP Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "python-dotenv==1.2.4",
    "PyJWT==2.15.1",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "bcrypt==4.2.1",
    "email-validator==2.2.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
include = ["*.py"]
