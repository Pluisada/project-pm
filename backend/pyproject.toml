[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management MVP Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "pydantic==2.7.4",
    "httpx==0.28.1",
    "bcrypt==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
include = ["*.py"]
